website = "https://platform.claude.com/"
[[endpoints]]
id = "anthropic-api"
base_url = "https://api.anthropic.com"
api_region = "全球"
documentation = "https://platform.claude.com/docs/en/api/messages"

[[endpoints.routes]]
protocol = "messages"
method = "POST"
callability = "documented_only"
documentation = "https://platform.claude.com/docs/en/api/messages"
path = "/v1/messages"

[docs]
overview = "https://platform.claude.com/docs/en/models/overview"
ai_sdk = "https://ai-sdk.dev/providers/ai-sdk-providers/anthropic"

[[capabilities]]
kind = "web_search"

[[capabilities.parameters]]
name = "tools[].type"
type = "string"
required = true
enum = [ "web_search_20250305" ]
route_mappings = [ "body.tools[].type" ]

[[capabilities.routes]]
protocol = "messages"
method = "POST"
callability = "documented_only"
documentation = "https://platform.claude.com/docs/en/agents-and-tools/tool-use/web-search-tool"
path = "/v1/messages"

[capabilities.links]
documentation = "https://platform.claude.com/docs/en/agents-and-tools/tool-use/web-search-tool"

[[capabilities]]
kind = "web_fetch"

[[capabilities.parameters]]
name = "tools[].type"
type = "string"
required = true
enum = [ "web_fetch_20250910" ]
route_mappings = [ "body.tools[].type" ]

[[capabilities.routes]]
protocol = "messages"
method = "POST"
callability = "documented_only"
documentation = "https://platform.claude.com/docs/en/agents-and-tools/tool-use/web-fetch-tool"
path = "/v1/messages"

[capabilities.links]
documentation = "https://platform.claude.com/docs/en/agents-and-tools/tool-use/web-fetch-tool"

[[capabilities]]
kind = "code_execution"

[[capabilities.parameters]]
name = "tools[].type"
type = "string"
required = true
enum = [ "code_execution_20250825", "code_execution_20260120", "code_execution_20260521" ]
route_mappings = [ "body.tools[].type" ]

[[capabilities.parameters]]
name = "tools[].allowed_callers[]"
type = "string"
required = false
enum = [ "direct", "code_execution_20250825", "code_execution_20260120", "code_execution_20260521" ]
route_mappings = [ "body.tools[].allowed_callers" ]
description = "Allowed invocation contexts for programmatic tool calling."

[[capabilities.input]]
name = "server_tool_use.input"
kind = "structured"
required = true
description = "Bash command or file operation generated by Claude."

[[capabilities.output]]
kind = "structured"
fields = [ "content[].type=server_tool_use", "content[].name=bash_code_execution", "content[].name=text_editor_code_execution", "content[].input.command", "content[].input.path", "content[].input.file_text", "content[].type=bash_code_execution_tool_result", "content[].content.stdout", "content[].content.stderr", "content[].content.return_code", "content[].content.content[].file_id", "content[].type=text_editor_code_execution_tool_result", "content[].content.content" ]

[[capabilities.routes]]
protocol = "messages"
method = "POST"
callability = "documented_only"
documentation = "https://platform.claude.com/docs/en/agents-and-tools/tool-use/code-execution-tool"
path = "/v1/messages"

[capabilities.links]
documentation = "https://platform.claude.com/docs/en/agents-and-tools/tool-use/code-execution-tool"

[[capabilities]]
kind = "tool_search"

[[capabilities.input]]
name = "search_request"
kind = "structured"
required = true
description = "模型生成的 BM25 query 或 regex pattern；可选 limit 控制结果数。"

[[capabilities.output]]
kind = "structured"
fields = [ "content[].type=server_tool_use", "content[].input.query", "content[].input.pattern", "content[].input.limit", "content[].type=tool_search_tool_result", "content[].content.tool_references[]" ]

[[capabilities.parameters]]
name = "tools[].type"
type = "string"
required = true
enum = [ "tool_search_tool_bm25_20251119" ]
route_mappings = [ "body.tools[].type" ]

[[capabilities.routes]]
protocol = "messages"
method = "POST"
callability = "documented_only"
documentation = "https://platform.claude.com/docs/en/agents-and-tools/tool-use/tool-search-tool"
path = "/v1/messages"

[capabilities.links]
documentation = "https://platform.claude.com/docs/en/agents-and-tools/tool-use/tool-search-tool"
