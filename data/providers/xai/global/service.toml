[[capabilities.parameters]]
name = "url"
type = "string"
required = false
description = "URL of an audio file to download and transcribe (server-side)."
route_mappings = [ "/stt:body.url" ]

[[capabilities.parameters]]
name = "model"
type = "string"
required = false
description = "`grok-voice-transcribe-2.0` (default)."
route_mappings = [ "/stt:body.model", "/stt:query.model" ]
default = "grok-voice-transcribe-2.0"

[[capabilities.parameters]]
name = "audio_format"
type = "string"
required = false
description = "Format hint for raw/headerless audio: `pcm`, `mulaw`, `alaw`. Container formats are auto-detected — do not set this field for MP3, WAV, etc."
route_mappings = [ "/stt:body.audio_format" ]

[[capabilities.parameters]]
name = "sample_rate"
type = "integer"
required = false
enum = [ 8000, 16000, 22050, 24000, 44100, 48000 ]
description = "Sample rate in Hz. Only required for raw audio (`pcm`, `mulaw`, `alaw`). Supported: `8000`, `16000`, `22050`, `24000`, `44100`, `48000`."
route_mappings = [ "/stt:body.sample_rate", "/stt:query.sample_rate" ]

[[capabilities.parameters]]
name = "language"
type = "string"
required = false
description = "Language code (e.g. `en`, `fr`, `de`). Biases transcription toward that language and selects the formatting rules for `format=true`. See [Supported Languages](#supported-languages)."
route_mappings = [ "/stt:body.language", "/stt:query.language" ]

[[capabilities.parameters]]
name = "format"
type = "boolean"
required = false
description = "When `true`, enables Inverse Text Normalization — converts spoken numbers/currency to written form (e.g. \"one hundred dollars\" → \"$100\"). Requires `language`. See [Supported Languages](#supported-languages) for coverage."
route_mappings = [ "/stt:body.format", "/stt:query.format" ]
default = false

[[capabilities.parameters]]
name = "multichannel"
type = "boolean"
required = false
description = "When `true`, transcribes each audio channel independently. Results returned in the `channels` array."
route_mappings = [ "/stt:body.multichannel", "/stt:query.multichannel" ]
default = false

[[capabilities.parameters]]
name = "channels"
type = "integer"
required = false
description = "Number of audio channels (2–8). Only required for multichannel raw audio. Auto-detected for container formats."
route_mappings = [ "/stt:body.channels", "/stt:query.channels" ]

[[capabilities.parameters]]
name = "diarize"
type = "boolean"
required = false
description = "When `true`, enables speaker diarization. Each word in the response includes a `speaker` field (integer) identifying the detected speaker."
route_mappings = [ "/stt:body.diarize", "/stt:query.diarize" ]

[[capabilities.parameters]]
name = "keyterm"
type = "string"
required = false
description = "A key term to bias transcription toward (e.g. product names, proper nouns). Repeat the field for multiple terms (e.g. `keyterm=Understand+The+Universe`). Max 100 terms, each up to 50 characters."
route_mappings = [ "/stt:body.keyterm", "/stt:query.keyterm" ]

[[capabilities.parameters]]
name = "filler_words"
type = "boolean"
required = false
description = "When `true`, filler words (e.g. \"uh\", \"um\", \"er\") are included in the transcript. When `false` (default), filler words are automatically removed from the transcript text and the `words` array."
route_mappings = [ "/stt:body.filler_words", "/stt:query.filler_words" ]
default = false

[[capabilities.parameters]]
name = "vad_threshold"
type = "number"
required = false
description = "Speech-probability threshold for the voice-activity gate (0.0–1.0). Audio segments scoring below the threshold are treated as non-speech and skipped for transcription. Lower values transcribe quieter or noisier speech (e.g. narrowband telephony) but may produce spurious text for background noise. `0` disables the gate."
route_mappings = [ "/stt:body.vad_threshold", "/stt:query.vad_threshold" ]

[[capabilities.parameters]]
name = "encoding"
type = "string"
required = false
enum = [ "pcm", "mulaw", "alaw", "opus" ]
description = "Audio encoding: `pcm`, `mulaw`, `alaw`, or `opus`. See [Opus Streaming](#opus-streaming)."
route_mappings = [ "/stt:query.encoding" ]
default = "pcm"

[[capabilities.parameters]]
name = "interim_results"
type = "boolean"
required = false
description = "When `true`, emit partial transcripts `is_final=false` every ~500 ms."
route_mappings = [ "/stt:query.interim_results" ]
default = false

[[capabilities.parameters]]
name = "endpointing"
type = "integer"
required = false
min = 0
max = 5000
description = "Silence duration (ms) before utterance-final event. Range: 0–5000. `0` = fire on any VAD silence boundary."
route_mappings = [ "/stt:query.endpointing" ]
default = 400

[[capabilities.parameters]]
name = "smart_turn"
type = "number"
required = false
description = "End-of-turn detection threshold (0.0–1.0). When set, enables Smart Turn — an ML model predicts whether the speaker has finished their thought at each silence boundary. See [Smart Turn](#smart-turn)."
route_mappings = [ "/stt:query.smart_turn" ]

[[capabilities.parameters]]
name = "smart_turn_timeout"
type = "integer"
required = false
min = 1
max = 5000
description = "Maximum silence duration (ms) before forcing `speech_final`, even when the Smart Turn model predicts the speaker hasn't finished. Range: 1–5000. Only applies when `smart_turn` is enabled. See [Smart Turn](#smart-turn)."
route_mappings = [ "/stt:query.smart_turn_timeout" ]

[[capabilities]]
kind = "speech_generation"

[[capabilities.parameters]]
name = "voice_id"
type = "string"
required = false
description = "Voice to use for synthesis. Defaults to `eve`. See [Voices](#voices)."
route_mappings = [ "/tts:body.voice_id" ]

[[capabilities.parameters]]
name = "language"
type = "string"
required = true
description = "BCP-47 language code (e.g. `en`, `zh`, `pt-BR`) or `auto` for automatic language detection. See [Supported Languages](#supported-languages)."
route_mappings = [ "/tts:body.language" ]

[[capabilities.parameters]]
name = "output_format"
type = "object"
required = false
description = "Output format configuration. Defaults to MP3 at 24 kHz / 128 kbps. See [Output Formats](#output-formats)."
route_mappings = [ "/tts:body.output_format" ]

[[capabilities.parameters]]
name = "speed"
type = "number"
required = false
description = "Speech speed multiplier. `1.0` is normal speed. Values below `1.0` slow down speech, values above `1.0` speed it up. Range: `0.7` to `1.5`. Defaults to `1.0`."
route_mappings = [ "/tts:body.speed" ]

[[capabilities.parameters]]
name = "optimize_streaming_latency"
type = "integer"
required = false
description = "Latency optimization level for streaming synthesis. `0` (default): No optimization — best audio quality. `1`: Reduced first-chunk size for lower time-to-first-audio, with minor quality tradeoff at chunk boundaries. `2`: Further reduced first-chunk size for lowest time-to-first-audio, with more noticeable quality tradeoff at chunk boundaries."
route_mappings = [ "/tts:body.optimize_streaming_latency" ]

[[capabilities.parameters]]
name = "text_normalization"
type = "boolean"
required = false
description = "Enable text normalization before synthesis. When `true`, the model normalizes written-form text (e.g. numbers, abbreviations, symbols) into spoken-form before generating audio. Defaults to `false`."
route_mappings = [ "/tts:body.text_normalization" ]

[[capabilities.parameters]]
name = "with_timestamps"
type = "boolean"
required = false
description = "Return character-level timing metadata alongside the audio. When `true`, the response is a JSON envelope containing base64-encoded audio plus per-character start/end times. Adds latency for the post-synthesis alignment pass. Defaults to `false`. See [Character-level timestamps](#character-level-timestamps)."
route_mappings = [ "/tts:body.with_timestamps" ]

[[capabilities.parameters]]
name = "replace"
type = "object"
required = false
description = "Map of phrases to spoken substitutions applied before synthesis. Values may be respellings (`{\"Acme Mobile\": \"Acme Mobull\"}`) or [IPA](#phonetic-pronunciations-with-ipa) phonetics (`{\"nginx\": \"/ˈɛndʒɪn ˈɛks/\"}`). See [Pronunciation Replacements](#pronunciation-replacements)."
route_mappings = [ "/tts:body.replace" ]

[[capabilities.routes]]
protocol = "https"
method = "POST"
callability = "documented_only"
documentation = "https://docs.x.ai/developers/model-capabilities/audio/text-to-speech"
path = "/tts"

[[capabilities.routes]]
protocol = "https"
method = "POST"
path = "/tts"
callability = "documented_only"
documentation = "https://docs.x.ai/developers/model-capabilities/audio/text-to-speech"

