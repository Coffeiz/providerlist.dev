[[capabilities]]
kind = "file_storage"

[[capabilities.parameters]]
name = "limit"
type = "integer"
required = false
description = "Maximum number of files to return. If not specified, uses the server default of 100. Maximum is 100."
max = 100
default = 100
route_mappings = [ "/files:query.limit" ]

[[capabilities.parameters]]
name = "order"
type = "string"
required = false
description = "Sort order. Either `\"asc\"` (ascending) or `\"desc\"` (descending). Defaults to `\"desc\"`."
enum = [ "asc", "desc" ]
route_mappings = [ "/files:query.order" ]

[[capabilities.parameters]]
name = "sort_by"
type = "string"
required = false
description = "Field to sort by. Options: `\"created_at\"`, `\"filename\"`, or `\"size\"`. Defaults to `\"filename\"`."
enum = [ "created_at", "filename", "size" ]
route_mappings = [ "/files:query.sort_by" ]

[[capabilities.parameters]]
name = "pagination_token"
type = "string"
required = false
description = "Pass the `pagination_token` returned by the previous response to fetch the next page. Omit it for the first page."
route_mappings = [ "/files:query.pagination_token" ]

[[capabilities.parameters]]
name = "expires_after"
type = "integer"
required = false
description = "`expires_after` is set in seconds, measured from upload time. It must be between `3600` (1 hour) and `2592000` (30 days), inclusive. Omit the field to keep the file permanently."
min = 3600
max = 2592000
route_mappings = [ "/files:form.expires_after" ]

[[capabilities.parameters]]
name = "purpose"
type = "string"
required = false
description = "Echoes the `purpose` value sent at upload time. SpaceXSI does not enforce or interpret this field; it is stored for OpenAI SDK compatibility. Setting `\"assistants\"` is the conventional choice."
route_mappings = [ "/files:form.purpose" ]

[[capabilities.parameters]]
name = "file_id"
type = "string"
required = false
route_mappings = [ "/files/{file_id}:path.file_id" ]

