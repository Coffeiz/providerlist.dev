[[capabilities.input]]
name = "input"
kind = "text"
required = true

[[capabilities.output]]
kind = "text"

[[capabilities.output]]
kind = "structured"
fields = [ "output[].type=web_search_call", "output[].content[].annotations[].type=url_citation" ]

[[capabilities.parameters]]
