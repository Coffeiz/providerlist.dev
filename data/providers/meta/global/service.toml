documentation = "https://dev.meta.ai/docs/api-reference"

[[capabilities.input]]
name = "file"
kind = "file"
required = true

[[capabilities.output]]
kind = "structured"
fields = [ "id", "bytes", "created_at", "expires_at", "filename", "object", "purpose", "status", "status_details" ]

[[capabilities.output]]
kind = "structured"
fields = [ "object", "data", "first_id", "last_id", "has_more" ]

[[capabilities.output]]
