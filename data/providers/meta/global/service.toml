[[capabilities]]
kind = "file_storage"

[[capabilities.parameters]]
name = "file"
type = "string"
required = true
route_mappings = [ "multipart/form-data.file" ]

[[capabilities.parameters]]
name = "purpose"
type = "string"
required = false
route_mappings = [ "multipart/form-data.purpose", "query.purpose" ]
enum = [ "user_data", "batch" ]

[[capabilities.parameters]]
name = "expires_after"
type = "object"
required = false
route_mappings = [ "multipart/form-data.expires_after" ]

[[capabilities.parameters]]
name = "limit"
type = "integer"
required = false
route_mappings = [ "query.limit" ]
min = 1
max = 10000

[[capabilities.parameters]]
name = "order"
type = "string"
required = false
route_mappings = [ "query.order" ]
enum = [ "asc", "desc" ]

[[capabilities.parameters]]
name = "after"
type = "string"
required = false
route_mappings = [ "query.after" ]

[[capabilities.parameters]]
name = "file_id"
type = "string"
required = true
route_mappings = [ "path.file_id" ]

