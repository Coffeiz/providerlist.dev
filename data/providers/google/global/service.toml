[[capabilities]]
kind = "batch"

[[capabilities.parameters]]
name = "model"
type = "string"
required = true
route_mappings = [ "path.batch.model" ]

[[capabilities.parameters]]
name = "displayName"
type = "string"
required = true
route_mappings = [ "body.batch.displayName" ]

[[capabilities.parameters]]
name = "inputConfig"
type = "object"
required = true
route_mappings = [ "body.batch.inputConfig" ]

[[capabilities.parameters]]
name = "inputConfig.requests.requests[]"
type = "array"
required = false
route_mappings = [ "body.batch.inputConfig.requests.requests" ]

[[capabilities.parameters]]
name = "inputConfig.fileName"
type = "string"
required = false
route_mappings = [ "body.batch.inputConfig.fileName" ]

[[capabilities.parameters]]
name = "priority"
type = "integer"
required = false
default = 0
route_mappings = [ "body.batch.priority" ]

[capabilities.execution]
mode = "async_job"
documentation = "任务创建后通过 batches.get 轮询；成功结果为内联响应或 responsesFile，失败信息位于 error。"
supports_cancel = true

[capabilities.execution.status_mapping]
"metadata.state" = "Google BatchState enum"
done = "long-running operation completion flag"

