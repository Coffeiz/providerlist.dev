[[capabilities]]
kind = "web_search"

[[capabilities.parameters]]
name = "model"
type = "string"
required = true
enum = [ "deepseek-v4-pro", "deepseek-v4-pro-0813", "deepseek-v4.1-flash", "deepseek-v4.1-flash-1017", "hy3" ]
route_mappings = [ "$.model" ]

[[capabilities.parameters]]
name = "enable"
type = "boolean"
required = true
default = true
route_mappings = [ "$.enable" ]

[[capabilities.parameters]]
name = "search_source"
type = "string"
required = false
default = "standard"
enum = [ "lite", "standard" ]
route_mappings = [ "$.search_source" ]

[[capabilities.parameters]]
name = "user_location"
type = "object"
required = false
route_mappings = [ "$.user_location" ]

[[capabilities.parameters]]
name = "tools[].type"
type = "string"
required = true
enum = [ "web_search" ]
route_mappings = [ "$.tools[].type" ]

[[capabilities.parameters]]
name = "tools[].search_source"
type = "string"
required = false
default = "standard"
enum = [ "lite", "standard" ]
route_mappings = [ "$.tools[].search_source" ]

[[capabilities.parameters]]
name = "tools[].search_context_size"
type = "string"
required = false
default = "medium"
enum = [ "low", "medium", "high" ]
route_mappings = [ "$.tools[].search_context_size" ]

[[capabilities.parameters]]
name = "tools[].user_location"
type = "object"
required = false
route_mappings = [ "$.tools[].user_location" ]

[[capabilities.input]]
name = "messages"
kind = "structured"
required = true

[[capabilities.input]]
name = "input"
kind = "structured"
required = true

[[capabilities.output]]
kind = "structured"
fields = [ "search_results[].index", "search_results[].url", "search_results[].name", "search_results[].snippet", "search_results[].site" ]

[[capabilities.output]]
kind = "structured"
fields = [ "output[].type", "output[].action.query", "output[].content[].annotations[].url", "output[].content[].annotations[].title" ]

