[[capabilities]]
kind = "web_search"

[[capabilities.parameters]]
name = "n"
type = "integer"
required = false
min = 1
max = 20
default = 10
route_mappings = [ "n" ]

[[capabilities.parameters]]
name = "category"
type = "string"
required = false
enum = [ "", "programming", "research", "gov", "business" ]
default = ""
route_mappings = [ "category" ]

[capabilities.execution]
mode = "sync"

[[capabilities.routes]]
protocol = "http"
method = "POST"
callability = "documented_only"
documentation = "https://platform.stepfun.com/docs/zh/api-reference/search/search"
path = "/search"

[[capabilities.pricing]]
currency = "CNY"

[[capabilities.pricing.rates]]
metric = "search_query"
unit = "per_request"
value = "0.04"

[capabilities.links]
documentation = "https://platform.stepfun.com/docs/zh/guides/developer/web-search"

[[capabilities.input]]
name = "query"
kind = "text"
required = true

[[capabilities.output]]
kind = "structured"
fields = [ "query", "category", "results[].url", "results[].position", "results[].title", "results[].time", "results[].snippet", "results[].content" ]

[docs]
overview = "https://platform.stepfun.com/docs/zh/guides/models/list"
