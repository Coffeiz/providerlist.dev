[[capabilities]]
kind = "web_search"

[[capabilities.parameters]]
name = "tools[].type"
type = "string"
required = true
enum = [ "web_search" ]
description = "Add the web_search tool to the tools array."
route_mappings = [ "$.tools[].type" ]

[[capabilities.routes]]
protocol = "responses"
method = "POST"
path = "/responses"
documentation = "https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-responses"

[[capabilities.input]]
name = "input"
kind = "text"
required = true
description = "The search query or instructions for the model."

[[capabilities.output]]
kind = "structured"
fields = [ "output[].type=web_search_call", "output[].action.query", "output_text" ]

[[capabilities.output]]
kind = "text"

