documentation = "https://docs.bailian.console.aliyun.com/zh/model-studio/more-tools"

[[capabilities]]
kind = "web_search"

[[capabilities.parameters]]
name = "tools[].type"
type = "string"
required = true
enum = [ "web_search" ]
description = "在模型请求的 tools 数组中声明联网搜索工具。"
route_mappings = [ "$.tools[].type" ]

[[capabilities.routes]]
protocol = "messages"
method = "POST"
path = "/v1/messages"
documentation = "https://www.alibabacloud.com/help/en/model-studio/anthropic-api-messages"

[[capabilities.routes]]
protocol = "anthropic"
method = "POST"
path = "/v1/messages"
documentation = "https://www.alibabacloud.com/help/en/model-studio/anthropic-api-messages"

[[capabilities.input]]
name = "input / messages"
kind = "text"
required = true
description = "告诉模型要搜索的内容；Responses API 示例使用 input，其他兼容协议使用各自的消息字段。"

[[capabilities.output]]
kind = "structured"
fields = [ "output[].type=web_search_call", "output[].action.query", "output_text" ]

[[capabilities.output]]
kind = "text"

[[capabilities]]
kind = "web_fetch"

[[capabilities.parameters]]
name = "tools[].type"
type = "string"
required = true
enum = [ "web_search", "web_extractor" ]
description = "在模型请求的 tools 数组中同时声明联网搜索与网页抓取工具。"
route_mappings = [ "$.tools[].type" ]

[[capabilities.routes]]
protocol = "messages"
method = "POST"
path = "/v1/messages"
documentation = "https://www.alibabacloud.com/help/en/model-studio/anthropic-api-messages"

[[capabilities.routes]]
protocol = "anthropic"
method = "POST"
path = "/v1/messages"
documentation = "https://www.alibabacloud.com/help/en/model-studio/anthropic-api-messages"

[[capabilities.input]]
name = "input / messages"
kind = "text"
required = true
description = "用自然语言说明要访问和提取的网页；请求输入字段随兼容协议而异。"

[[capabilities.output]]
kind = "structured"
fields = [ "output[].type=web_extractor_call", "output[].goal", "output[].output", "output_text" ]

[[capabilities.output]]
kind = "text"

